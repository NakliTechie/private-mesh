name: fabric-sdk-go

on:
  push:
    branches: [main]
    paths:
      - 'fabric-sdk-go/**'
      - '.github/workflows/fabric-sdk-go.yml'
  pull_request:
    paths:
      - 'fabric-sdk-go/**'
      - '.github/workflows/fabric-sdk-go.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test
        run: ./fabric-sdk-go/smoke.sh
