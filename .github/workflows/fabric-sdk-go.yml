name: fabric-sdk-go

on:
  push:
    branches: [main]
    paths:
      - 'fabric-sdk-go/**'
      - '.github/workflows/fabric-sdk-go.yml'
  pull_request:
    paths:
      - 'fabric-sdk-go/**'
      - '.github/workflows/fabric-sdk-go.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Smoke test
        run: ./fabric-sdk-go/smoke.sh
