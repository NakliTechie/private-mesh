name: fabric-sdk-go

on:
  push:
    branches: [main]
    paths:
      - 'fabric-sdk-go/**'
      - '.github/workflows/fabric-sdk-go.yml'
  pull_request:
    paths:
      - 'fabric-sdk-go/**'
      - '.github/workflows/fabric-sdk-go.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Smoke test
        run: ./fabric-sdk-go/smoke.sh
