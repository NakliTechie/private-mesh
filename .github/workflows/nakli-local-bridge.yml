name: nakli-local-bridge

on:
  push:
    branches: [main]
    paths:
      - 'nakli-local-bridge/**'
      - '.github/workflows/nakli-local-bridge.yml'
  pull_request:
    paths:
      - 'nakli-local-bridge/**'
      - '.github/workflows/nakli-local-bridge.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Smoke test
        run: ./nakli-local-bridge/smoke.sh
