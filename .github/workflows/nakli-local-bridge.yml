name: nakli-local-bridge

on:
  push:
    branches: [main]
    paths:
      - 'nakli-local-bridge/**'
      - '.github/workflows/nakli-local-bridge.yml'
  pull_request:
    paths:
      - 'nakli-local-bridge/**'
      - '.github/workflows/nakli-local-bridge.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Smoke test
        run: ./nakli-local-bridge/smoke.sh
