name: nakli-cf-worker

on:
  push:
    branches: [main]
    paths:
      - 'nakli-cf-worker/**'
      - '.github/workflows/nakli-cf-worker.yml'
  pull_request:
    paths:
      - 'nakli-cf-worker/**'
      - '.github/workflows/nakli-cf-worker.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Smoke test
        run: ./nakli-cf-worker/smoke.sh
