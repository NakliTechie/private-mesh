name: nakli-cf-worker

on:
  push:
    branches: [main]
    paths:
      - 'nakli-cf-worker/**'
      - '.github/workflows/nakli-cf-worker.yml'
  pull_request:
    paths:
      - 'nakli-cf-worker/**'
      - '.github/workflows/nakli-cf-worker.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Smoke test
        run: ./nakli-cf-worker/smoke.sh
