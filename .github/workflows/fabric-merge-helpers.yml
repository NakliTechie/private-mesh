name: fabric-merge-helpers

on:
  push:
    branches: [main]
    paths:
      - 'fabric-merge-helpers/**'
      - '.github/workflows/fabric-merge-helpers.yml'
  pull_request:
    paths:
      - 'fabric-merge-helpers/**'
      - '.github/workflows/fabric-merge-helpers.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test
        run: ./fabric-merge-helpers/smoke.sh
