name: nakli-cli

on:
  push:
    branches: [main]
    paths:
      - 'nakli-cli/**'
      - '.github/workflows/nakli-cli.yml'
  pull_request:
    paths:
      - 'nakli-cli/**'
      - '.github/workflows/nakli-cli.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test
        run: ./nakli-cli/smoke.sh
