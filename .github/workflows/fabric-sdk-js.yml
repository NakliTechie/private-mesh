name: fabric-sdk-js

on:
  push:
    branches: [main]
    paths:
      - 'fabric-sdk-js/**'
      - '.github/workflows/fabric-sdk-js.yml'
  pull_request:
    paths:
      - 'fabric-sdk-js/**'
      - '.github/workflows/fabric-sdk-js.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Smoke test
        run: ./fabric-sdk-js/smoke.sh
