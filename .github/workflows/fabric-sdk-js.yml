name: fabric-sdk-js

on:
  push:
    branches: [main]
    paths:
      - 'fabric-sdk-js/**'
      - '.github/workflows/fabric-sdk-js.yml'
  pull_request:
    paths:
      - 'fabric-sdk-js/**'
      - '.github/workflows/fabric-sdk-js.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Smoke test
        run: ./fabric-sdk-js/smoke.sh
